<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block elements</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p>Hii I am block element</p>
    <h3>This is Inline element</h3>
    <div>Hii I am also Block element</div>
    <span>I am Span and i am Inline elements</span>
    <a href="https//google.com">Google</a>
    <br>
    <br>
    <!-- Quiz---->
    <!-- Without using br tag make a vertically alinged form for sking name ,city and pincode: -->
    <form>
        <div>
            <label for="name">Name:</label>
            <input type="text" name="text" id="name" placeholder="Enter your name">
        </div>
        <div>
            <label for="City">City:</label>
            <input type="city" name="city" id="city" placeholder="Enter your city">
        </div>
        <div>
            <label for="Pincode">Pincode:</label>
            <input type="Pincode" name="Pincode" id="Pincode" placeholder="Enter your Pincode">
        </div>
    </form>
    <br>
    <br>

    //classes and Id:
    <div id="firstdiv" class="red yellow">First</div>
    <div id="seconddiv">Second</div>
    <br>
    <br>
    <!-- How to add Video and audio: -->
    <video src="BotFiesta.mp4" height="500" controls loop autoplay muted>Click for Video</video>
    <audio src="Chan Kithan (PenduJatt.dev).mp3" controls loop muted preload></audio>

    <!-- SVG Attributes -->
    <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="40" stroke="green" stroke-width="4" fill="yellow" />
        <title>Yellow circle with green border</title>
    </svg>
    <video src=""></video>
    <!-- iframe -->
    <iframe src="https://www.codewithharry.com" width="500px" height="400px">codewithharry</iframe>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=hs1nJIRvrQlep0XD"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>




</body>

</html>
