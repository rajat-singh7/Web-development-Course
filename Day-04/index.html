<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>
        <h1>Student Registration</h1>
        <label for="name">Full name</label>
        <br>
        <input type="text" name="name" id="name" placeholder="input your name">
        <br>
        <label for="number">Student Number</label>
        <br>
        <input type="text" name="number" id="number" placeholder="eg.65748 90733">
        <br>
        <label for="email">Student Email</label>
        <br>
        <input type="email" name="email" id="email" placeholder="eg.jitendra435@gmail.com">
        <br>
        <label for="date">Date of Birth</label>
        <br>
        <input type="date" name="date" id="date">
        <br>
        <label for="gender">Gender</label>
        <br>
        <label for="male"></label>

        <input type="radio" name="gender" id="male" value="male">Male

        <label for="female"></label>

        <input type="radio" name="gender" id="female" value="female">Female

        <label for="other"></label>

        <input type="radio" name="gender" id="other" value="other">Other
        <br>
        <br>
        <label for="course-select">Select Course:</label>
        <select name="course" id="course-select">
            <option value="B.Tech-CSE">B.Tech-CSE</option>
            <option value="B.Tech-Mechanical">B.Tech-Mechnical</option>
            <option value="B.Tech-ECE">B.Tech-ECE</option>
            <option value="B.Tech-Civil">B.Tech-Civil</option>
            <option value="Crime Branch">Crime branch</option>
        </select>
        <br>
        <label for="Department">Department:</label>
        <label for="CSE"></label>
        <input type="checkbox" name="Department[]" id="CSE" value="CSE">CSE
        <label for="AIML"></label>
        <input type="checkbox" name="Department[]" id="AIML" value="AIML">AIML
        <label for="ECE"></label>
        <input type="checkbox" name="Department[]" id="ECE" value="ECE">ECE
        <label for="ELECTRICAL"></label>
        <input type="checkbox" name="Department[]" id="ELECTRICAL" value="ELECTRICAL">ELECTRICAL
        <br>
        <label for="photo">Student Photo:</label>
        <input type="file" value="choose file" id="photo" placeholder="Choose file" name="photo">
        <br>
        <label for="comment">Comment your thoughts:</label>
        <br>
        <textarea id="comment" name="comments " rows="6" cols="50" placeholder="Share your thoughts"></textarea>
        <br>
        <label for="check"></label>
        <input type="checkbox" id="check" value="rules">I am understand the terms and conditions of this event
        <br>
        <br>
        <br>
        <div> 
        <label for="register"></label>
        <input type="submit" name="register" id="register" value="register">
        <label for="cancel"></label>
        <input type="button" name="cancel" id="cancel" value="cancel" style="margin-right: 15px;">
        </div>
        <h3>Best of Luck for Upcoming Hackathon</h3>
    </form>

</body>

</html>
